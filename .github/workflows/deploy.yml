name: Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6.0.1

      - name: Log in to GHCR
        uses: docker/login-action@v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/mykct-api:latest
            ghcr.io/${{ github.repository_owner }}/mykct-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Pull and recreate
        run: |
          set -euo pipefail
          cd /srv/mykct-api
          exec 9>.deploy.lock
          flock -w 900 9
          docker compose pull app
          docker compose up -d --force-recreate --no-deps app
          docker image prune -f

      - name: Smoke check
        run: |
          set -euo pipefail
          port=$(sed -n 's/^HTTP_PORT=//p' /srv/mykct-api/.env | head -1)
          curl -fsS --retry 15 --retry-delay 2 --retry-connrefused \
            "http://127.0.0.1:${port:-8080}/api/ping"
