services:
  mongo:
    container_name: mongo
    image: mongo:8
    restart: always
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    networks:
      - mykct
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    container_name: mykct-api
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      SERVICE_NAME: ${SERVICE_NAME:-mykct-api}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PRETTY: ${LOG_PRETTY:-false}
      HTTP_PORT: ${HTTP_PORT:-8080}
      MONGO_URI: mongodb://mongo:27017/?directConnection=true
      MONGO_DATABASE: ${MONGO_DATABASE}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-1.0}
      SENTRY_DEBUG: ${SENTRY_DEBUG:-false}
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    networks:
      - mykct
    depends_on:
      mongo:
        condition: service_healthy

networks:
  mykct:
    driver: bridge

volumes:
  mongo_data:
